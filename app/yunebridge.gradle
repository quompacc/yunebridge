// YuneBridge: fork-spezifische Build-Konfiguration.
// Liegt bewusst außerhalb von app/build.gradle (dort nur eine apply-Zeile),
// damit Rebases auf Upstream möglichst konfliktfrei bleiben.
//
// Versionsschema: versionCode = Upstream-versionCode * 100 + ybPatch
//                 versionName = <Upstream-versionName>-yb<ybPatch>
// ybPatch bei jedem YuneBridge-Release auf derselben Upstream-Basis erhöhen,
// bei einer neuen Upstream-Version wieder auf 1 setzen.
final def ybPatch = 4

final def ybLocalProps = new Properties()
final def ybLocalPropsFile = rootProject.file("local.properties")
if (ybLocalPropsFile.exists()) {
    ybLocalPropsFile.withInputStream { ybLocalProps.load(it) }
}
final def ybProp = { String key -> System.getenv(key) ?: ybLocalProps.getProperty(key) }

// Ohne Keystore entsteht eine unsignierte Release-APK (so baut auch F-Droid)
final def ybKeystorePath = ybProp("KEYSTORE_FILE")
final def ybKeystore = ybKeystorePath ? rootProject.file(ybKeystorePath) : null
final def ybHasKeystore = ybKeystore != null && ybKeystore.exists()

// Branding der Texte: erzeugt beim Bauen aus allen values*/strings.xml von main
// Overrides, in denen "Gadgetbridge" durch "YuneBridge" ersetzt ist. Die Upstream-
// Dateien bleiben unverändert, neue oder geänderte Upstream-Texte werden automatisch
// mit angepasst. Ausgelassen werden:
//  - Texte, die bewusst das Gadgetbridge-Projekt meinen (ybBrandingExcludes)
//  - Texte der anderen Varianten (Bangle.js, Nightly)
//  - Keys, die app/src/yunebridge/res selbst definiert (dort von Hand gepflegt)
//  - URLs und Domains (…/Gadgetbridge, Gadgetbridge.org)
final def ybBrandingExcludes = [
        "codeberg_url",                        // Link zum Upstream-Quellcode
        "pref_title_weather_summary",          // verweist auf die Gadgetbridge-Website
        "miband_firmware_suggest_whitelist",   // Meldung an die Gadgetbridge-Entwickler
        "internet_helper_permission_summary",  // Name der Zusatz-App "Internet Helper for Gadgetbridge"
]

abstract class YbBrandingTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getMainRes()

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getFlavorRes()

    @Input
    abstract SetProperty<String> getExcludedKeys()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        final File out = outputDir.get().asFile
        out.deleteDir()
        out.mkdirs()

        final Set<String> skip = new HashSet<>(excludedKeys.get())
        flavorRes.get().asFile.eachFileRecurse { File f ->
            if (f.name.endsWith(".xml")) {
                (f.getText("UTF-8") =~ /<string\s+name="([^"]+)"/).each { skip << it[1] }
            }
        }

        final def stringRe = ~/(?s)<string\s+name="([^"]+)"([^>]*)>(.*?)<\/string>/
        // Nur das Wort, nicht in URLs/Pfaden oder als Domain
        final def brandRe = ~/(?<![\w\/.@])Gadgetbridge(?![\w\/]|\.(?:org|com))/

        mainRes.get().asFile.eachDir { File dir ->
            final File src = new File(dir, "strings.xml")
            if (!dir.name.startsWith("values") || !src.exists()) {
                return
            }
            final String text = src.getText("UTF-8")
            final List<String> entries = []
            (text =~ stringRe).each { m ->
                final String name = m[1]
                final String body = m[3]
                if (skip.contains(name) || name ==~ /.*_(banglejs_main|banglejs_nightly|main_nightly|main_nopebble)/) {
                    return
                }
                final String replaced = body.replaceAll(brandRe, "YuneBridge")
                if (replaced != body) {
                    entries << "    <string name=\"${name}\"${m[2]}>${replaced}</string>".toString()
                }
            }
            if (!entries.isEmpty()) {
                final def root = (text =~ /<resources[^>]*>/)
                final String rootTag = root.find() ? root.group() : "<resources>"
                final File target = new File(out, dir.name)
                target.mkdirs()
                new File(target, "strings.xml").setText(
                        "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!-- Automatisch erzeugt von app/yunebridge.gradle – nicht bearbeiten -->\n" +
                                rootTag + "\n" + entries.join("\n") + "\n</resources>\n", "UTF-8")
            }
        }

        generateAccentOverlays(out)
    }

    // Hängt jedes ThemeOverlay.App.Accent.<Farbe>.<Light|Dark> an YuneBridge.Extras.<Light|Dark>,
    // damit der YuneBridge-Karten-Look für jede Akzentfarbe gilt. "Orange" (YuneBridge-Standard)
    // wird vollständig durch YuneBridge.Accent.<Light|Dark> ersetzt.
    private void generateAccentOverlays(final File out) {
        final File styles = new File(mainRes.get().asFile, "values/styles.xml")
        final def overlayRe = ~/(?s)<style\s+name="(ThemeOverlay\.App\.Accent\.([A-Za-z]+)\.(Light|Dark))"[^>]*>(.*?)<\/style>/
        final List<String> entries = []
        (styles.getText("UTF-8") =~ overlayRe).each { m ->
            final String name = m[1]
            final String accent = m[2]
            final String variant = m[3]
            if (accent == "Orange") {
                entries << "    <style name=\"${name}\" parent=\"YuneBridge.Accent.${variant}\" />".toString()
            } else {
                entries << "    <style name=\"${name}\" parent=\"YuneBridge.Extras.${variant}\">${m[4]}</style>".toString()
            }
        }
        if (entries.isEmpty()) {
            throw new GradleException("YuneBridge: keine ThemeOverlay.App.Accent.* in main/res/values/styles.xml gefunden – Upstream hat die Akzent-Overlays umgebaut")
        }
        final File target = new File(out, "values")
        target.mkdirs()
        new File(target, "yb_accent_overlays.xml").setText(
                "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!-- Automatisch erzeugt von app/yunebridge.gradle – nicht bearbeiten -->\n<resources>\n" +
                        entries.join("\n") + "\n</resources>\n", "UTF-8")
    }
}

final def ybBranding = tasks.register("generateYunebridgeBranding", YbBrandingTask) {
    mainRes = layout.projectDirectory.dir("src/main/res")
    flavorRes = layout.projectDirectory.dir("src/yunebridge/res")
    excludedKeys.set(ybBrandingExcludes)
    outputDir = layout.buildDirectory.dir("generated/res/yunebridgeBranding")
}

androidComponents {
    onVariants(selector().withFlavor(new kotlin.Pair("device_type", "yunebridge"))) { variant ->
        variant.sources.res?.addGeneratedSourceDirectory(ybBranding, { it.outputDir })
    }
}

android {
    // Standard-Akzentfarbe: andere Varianten behalten "red", YuneBridge nutzt "orange" (= Yune-Orange)
    defaultConfig {
        buildConfigField "String", "YB_DEFAULT_ACCENT", "\"red\""
    }

    signingConfigs {
        if (ybHasKeystore) {
            yunebridge {
                storeFile ybKeystore
                storePassword ybProp("KEYSTORE_PASSWORD")
                keyAlias ybProp("KEY_ALIAS")
                keyPassword ybProp("KEY_PASSWORD")
            }
        }
    }

    productFlavors {
        yunebridge {
            dimension "device_type"
            applicationId "io.github.quompacc.yunebridge"
            versionCode android.defaultConfig.versionCode * 100 + ybPatch
            versionName "${android.defaultConfig.versionName}-yb${ybPatch}"
            buildConfigField "String", "YB_DEFAULT_ACCENT", "\"orange\""
            if (ybHasKeystore) {
                signingConfig signingConfigs.yunebridge
            }
        }
    }
}

// Jetpack Compose für die neuen YuneBridge-Screens. Die Bibliotheken bekommt nur der
// Flavor yunebridge; der Compose-Compiler ist an die Kotlin-Version aus libs.versions.toml gekoppelt.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    buildFeatures {
        compose = true
    }
}

final def ybCatalog = extensions.getByType(VersionCatalogsExtension).named("libs")
final def ybVersion = { String key -> ybCatalog.findVersion(key).get().requiredVersion }

dependencies {
    // Der Compose-Compiler läuft für alle Varianten und braucht dort die Runtime;
    // UI-Bibliotheken bekommt nur yunebridge.
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.compose.runtime:runtime"
    yunebridgeImplementation platform("androidx.compose:compose-bom:2026.09.00")
    yunebridgeImplementation "androidx.compose.material3:material3"
    yunebridgeImplementation "androidx.compose.ui:ui"
    yunebridgeImplementation "androidx.compose.ui:ui-tooling-preview"
    yunebridgeImplementation "androidx.activity:activity-compose:${ybVersion('androidx-activity')}"
    // collectAsStateWithLifecycle: Daten nur sammeln, solange ein Screen sichtbar ist (Akku)
    yunebridgeImplementation "androidx.lifecycle:lifecycle-runtime-compose:${ybVersion('androidx-lifecycle')}"
}
